<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stock detail view — candlestick charts, technical indicators, analyst forecasts, and fundamental analysis">
  <title>Stock Detail | ScanNasYork</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- TradingView Lightweight Charts v4 -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Chart.js for Financial Performance bar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site-navigation.css">
  <script defer src="/js/components/site-navigation.js"></script>
</head>
<body>

<div id="loading-overlay" class="loading-overlay"><div class="spinner"></div></div>

<div class="app-container">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="logo-icon">SN</div>
      <div>
        <h1>ScanNasYork</h1>
        <div class="subtitle">Stock Detail</div>
      </div>
    </div>
    <button type="button" class="site-nav-toggle" data-sidebar-toggle aria-controls="site-sidebar" aria-expanded="false" aria-label="Open navigation">Menu</button>
  </nav>

  <a href="/screener.html" class="back-link">← Back to Screener</a>

  <!-- STOCK HEADER -->
  <div class="stock-header" id="stock-header">
    <div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="symbol-badge" id="detail-symbol">&minus;</div>
        <button id="fav-star-btn" class="fav-star-btn" aria-label="Toggle Favorite" title="Add to Watchlist" style="background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); line-height: 1; transition: transform 0.2s, color 0.2s; padding: 0;">☆</button>
      </div>
      <div class="company-name" id="detail-name">Loading…</div>
      <span class="cell-sector" id="detail-sector" style="margin-top:8px;display:inline-block">&minus;</span>
      <div class="stock-description" style="margin-top: 15px; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; max-width: 800px;">
        <p id="stock-desc-text">Fetching company profile…</p>
      </div>
    </div>
    <div class="price-display">
      <div class="price-value" id="detail-price">&minus;</div>
      <div class="price-change" id="detail-change">&minus;</div>
    </div>
  </div>

  <!-- METRIC CARDS -->
  <div class="metrics-grid" id="metrics-grid"></div>

  <!-- CANDLESTICK CHART (TradingView Lightweight Charts) -->
  <div class="chart-panel">
    <div class="chart-panel-header">
      <h2>Price Chart</h2>
      <div class="chart-range-buttons" id="chart-range-buttons">
        <button data-range="1d" class="active">1D</button>
        <button data-range="1w">1W</button>
        <button data-range="1m">1M</button>
        <button data-range="3m">3M</button>
      </div>
    </div>
    <div id="candlestick-chart"></div>
  </div>

  <!-- ANALYST FORECAST -->
  <div class="forecast-panel" id="forecast-panel">
    <div class="forecast-panel-header">
      <h2>Analyst Forecast</h2>
    </div>
    <div class="forecast-body" id="forecast-body">
      <div class="forecast-loading">
        <div class="spinner-sm" style="width:20px;height:20px;border:2px solid var(--border-default);border-top-color:var(--accent-primary);border-radius:50%;animation:spin 0.8s linear infinite"></div>
        Loading analyst data…
      </div>
    </div>
  </div>

  <!-- FINANCIAL PERFORMANCE CHART -->
  <section class="panel mb-4" id="financial-performance-panel">
    <div class="panel-header d-flex-between">
      <h2>Financial Performance</h2>
      <div class="chart-controls">
        <div class="toggle-group">
          <button id="fp-btn-revenue" class="active" onclick="switchFinMetric('revenue')">Revenue</button>
          <button id="fp-btn-eps" onclick="switchFinMetric('eps')">EPS</button>
        </div>
        <div class="toggle-group">
          <button id="fp-btn-quarterly" class="active" onclick="switchFinPeriod('quarterly')">Quarterly</button>
          <button id="fp-btn-annual" onclick="switchFinPeriod('annual')">Annual</button>
        </div>
      </div>
    </div>
    <div class="panel-body">
      <div style="height: 350px; position: relative;">
        <canvas id="fin-perf-chart" role="img" aria-label="Revenue and earnings performance chart"></canvas>
        <p id="financial-chart-status" class="financial-chart-status" role="status" hidden></p>
      </div>
    </div>
  </section>

  <!-- ANNUAL & QUARTERLY EARNINGS -->
  <section class="panel" id="earnings-panel">
    <div class="panel-header">
      <h2>Revenue & Earnings History</h2>
    </div>
    <div class="panel-body">
      <div class="table-container">
        <table class="data-table earnings-table" id="earnings-table">
          <thead>
            <tr>
              <th style="text-align:left;width:160px">Period</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">EPS</th>
              <th style="text-align:right">Net Income</th>
              <th style="text-align:right;width:120px">Report Date</th>
            </tr>
          </thead>
          <tbody id="earnings-body">
            <tr><td colspan="5" class="text-center" style="padding:24px;color:var(--text-muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<div id="toast-container" class="toast-container"></div>



<script src="/js/shared/utils.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/pages/stock.js"></script>
</body>
</html>
